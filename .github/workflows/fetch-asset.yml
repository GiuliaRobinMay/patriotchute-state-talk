# One-shot helper: fetch a generated asset into the repo.
# The development sandbox cannot reach media hosts; this runner can.
name: fetch-asset
on:
  workflow_dispatch:
    inputs:
      url:
        description: Where the asset lives right now
        required: true
      path:
        description: Repo path to write it to
        required: true
        default: flag.jpg
      width:
        description: Resize to this width (JPEG, quality 80)
        required: false
        default: "1600"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and optimise
        run: |
          curl -sSfL -o /tmp/asset.bin "${{ inputs.url }}"
          file /tmp/asset.bin
          convert /tmp/asset.bin -resize "${{ inputs.width }}>" -quality 80 -strip "${{ inputs.path }}"
          ls -la "${{ inputs.path }}"
      - name: Commit
        run: |
          git config user.name "asset-fetcher"
          git config user.email "actions@users.noreply.github.com"
          git add "${{ inputs.path }}"
          git commit -m "Add fetched asset: ${{ inputs.path }}"
          git push
